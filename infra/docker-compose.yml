name: optiq

x-backend: &backend
  build:
    context: ../backend
    args:
      INSTALL_EXTRAS: ${INSTALL_EXTRAS:-false}
  env_file:
    - ../.env
  environment: &backend-env
    DEBUG: "false"
    DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-optiq}:${POSTGRES_PASSWORD:-optiq_dev_password}@postgres:5432/${POSTGRES_DB:-optiq}
    REDIS_URL: redis://redis:6379/0
    JOB_BACKEND: rq
    MAIL_BACKEND: smtp
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    SMTP_USE_TLS: "false"
    SMTP_USER: ""
    SMTP_PASSWORD: ""
    SMTP_FROM: Optiq <noreply@optiq.local>
    RESEND_API_KEY: ""
    MLFLOW_TRACKING_URI: ${COMPOSE_MLFLOW_TRACKING_URI:-}
    FRONTEND_URL: http://localhost:${COMPOSE_FRONTEND_PORT:-3001}
    OLLAMA_BASE_URL: ${COMPOSE_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-optiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-optiq_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-optiq}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-optiq} -d ${POSTGRES_DB:-optiq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21.4
    ports:
      - "127.0.0.1:${COMPOSE_MAIL_PORT:-8025}:8025"

  backend:
    <<: *backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:${COMPOSE_API_PORT:-8000}:8000"
    volumes:
      - ../backend:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  worker:
    <<: *backend
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ../backend:/app
    command: sh -c 'exec rq worker --url "$$REDIS_URL" default'

  frontend:
    build:
      context: ../frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${COMPOSE_FRONTEND_PORT:-3001}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${COMPOSE_API_PORT:-8000}
      NEXT_PUBLIC_MLFLOW_URL: ${NEXT_PUBLIC_MLFLOW_URL:-}
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev -- --hostname 0.0.0.0

  mlflow:
    profiles: [tracking]
    build:
      context: ../mlflow
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${COMPOSE_MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER:-optiq}:${POSTGRES_PASSWORD:-optiq_dev_password}@postgres:5432/mlflow
      --serve-artifacts --artifacts-destination /mlflow/artifacts

volumes:
  postgres_data:
  mlflow_artifacts:
