# Curated starter registry; API token rates in USD per million.
# Ollama has zero API charges, not zero operating cost.
providers:
  openai:
    adapter: openai
    requires_api_key: true
    enabled: true
    models:
      gpt-4o:
        display_name: GPT-4o
        enabled: true
        default_temperature: 0.7
        max_tokens: 4096
        pricing:
          input_per_1m: 2.5
          output_per_1m: 10.0
        advice_tier: balanced
        supported_tasks:
        - writing
        - summarization
        - extraction
        - classification
        context_window: 128000
      gpt-4o-mini:
        display_name: GPT-4o Mini
        enabled: true
        default_temperature: 0.7
        max_tokens: 4096
        pricing:
          input_per_1m: 0.15
          output_per_1m: 0.6
        advice_tier: budget
        supported_tasks:
        - writing
        - summarization
        - extraction
        - classification
        context_window: 128000
    pricing_source: https://developers.openai.com/api/docs/models
    pricing_checked_at: '2026-10-05'
